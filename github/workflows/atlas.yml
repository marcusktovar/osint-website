name: ATLAS - Refresh and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dataset generator
        run: python -m unittest discover -s tests -v
      - name: Refresh verified country metadata
        run: python scripts/build.py
      - name: Validate generated country profiles
        run: python scripts/validate.py
      - name: Save scheduled data refresh back to repository
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/countries.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh sourced atlas country data [skip ci]'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
